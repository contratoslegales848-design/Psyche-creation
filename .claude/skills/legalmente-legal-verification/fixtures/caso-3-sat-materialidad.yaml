notas: "Capa C — el término 'materialidad' y la referencia al SAT son 100% mexicanos y ya lo dejan visible desde el título ('SAT'). Falta declarar México explícitamente en la primera línea del copy, no asumir que basta con 'SAT' para un lector no mexicano. Confianza 'media' porque la fuente citada es la ley marco; falta cruzar con el criterio normativo/jurisprudencial vigente del SAT antes de subir a 'alta'."
