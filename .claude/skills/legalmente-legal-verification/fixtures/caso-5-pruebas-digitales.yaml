notas: "El hook por sí solo ya es una afirmación jurídica, no solo el copy largo. Antes de aprobar, hay que verificar caso por caso: admisibilidad, autenticidad, integridad, pertinencia y jurisdicción para cada uno de los diez tipos de prueba propuestos. No se puede tratar como panhispánico cerrado con la investigación actual (ninguna fuente reunida todavía)."
