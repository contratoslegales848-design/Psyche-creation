nucleo_transversal: "Que ciertos tipos de evidencia digital pueden usarse en juicio, y que existen criterios de admisibilidad, autenticidad, integridad y pertinencia, es una idea transversal."
variaciones_materiales: "Qué se admite en concreto, con qué requisitos de cadena de custodia y bajo qué reglas procesales, depende del país y del tipo de proceso (civil, penal, laboral). El título afirma como hecho panhispánico cerrado ('sí se aceptan') algo que en realidad depende de admisibilidad, autenticidad, integridad, pertinencia y jurisdicción — ninguna de las cuales está verificada todavía para las diez pruebas listadas."
