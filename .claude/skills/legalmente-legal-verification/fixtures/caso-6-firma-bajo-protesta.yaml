claim_id: caso-6-firma-bajo-protesta
texto_exacto: "Si te despiden, firma bajo protesta."
ubicacion: hook
tipo: consejo
alcance: CAPA_B_VARIABLE
jurisdiccion:
nucleo_transversal: "La idea de que un trabajador puede dejar constancia de su desacuerdo al firmar un documento, sin que eso implique aceptar su contenido, existe en distintas tradiciones jurídicas laborales."
variaciones_materiales: "El mecanismo concreto ('firmar bajo protesta'), su efecto legal exacto, y si existen alternativas más seguras (no firmar, firmar con testigos, acudir a la autoridad laboral) dependen del país y del sistema procesal laboral. Como recomendación de conducta dirigida en segunda persona ('si te despiden, firma...'), esto es asesoría individual disfrazada de regla general, no una explicación de un concepto."
fuentes:
confianza: baja
riesgo_falsa_universalizacion: alto
riesgo_asesoria: alto
platform_review_required: false
confidentiality_review_required: false
redaccion_prohibida: "Si te despiden, firma bajo protesta."
redaccion_segura: "¿Qué significa 'firmar bajo protesta' cuando te despiden, y por qué no es lo mismo en todos los países? (explicar el concepto, no instruir la conducta)"
estado: BLOQUEADO
revisor_humano_requerido: true
notas: "Bloqueado por dos razones acumuladas: (1) es una recomendación de conducta en segunda persona, no una explicación — parece asesoría individual; (2) el mecanismo y su efecto varían por país y no están verificados. Requiere reformular como explicación de concepto con jurisdicción declarada, y revisión humana explícita antes de reconsiderar."
