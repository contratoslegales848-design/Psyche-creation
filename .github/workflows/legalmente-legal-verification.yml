name: LegalMente — Verificación jurídica

on:
  pull_request:
    branches: [main]
    paths:
      - ".claude/skills/legalmente-legal-verification/**"
      - "content/**"
      - "src/**"
      - "scripts/**"
      - "visual/**"
      - "contract/**"
      - "requirements.txt"
      - ".github/workflows/legalmente-legal-verification.yml"
  push:
    branches: [main]
    paths:
      - ".claude/skills/legalmente-legal-verification/**"
      - "content/**"
      - "src/**"
      - "scripts/**"
      - "visual/**"
      - "contract/**"
      - "requirements.txt"
      - ".github/workflows/legalmente-legal-verification.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: legalmente-legal-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar skill jurídica (unittest + fixtures + higiene)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/skills/legalmente-legal-verification
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: compileall (detecta errores de sintaxis)
        run: python3 -m compileall -q scripts/

      - name: compileall de los scripts de la raíz
        working-directory: .
        run: python3 -m compileall -q scripts/

      - name: git diff --check (sin conflictos de espacio en blanco)
        working-directory: .
        run: git diff --check

      - name: Sin bytecode rastreado (__pycache__, .pyc, .pyo)
        working-directory: .
        run: |
          set -e
          MATCHES="$(git ls-files -- '*.pyc' '*.pyo' '*__pycache__*')"
          if [ -n "$MATCHES" ]; then
            echo "Se encontró bytecode rastreado en el repositorio:"
            echo "$MATCHES"
            exit 1
          fi
          echo "Sin bytecode rastreado."

      # Descubrimiento, no enumeración. Enumerar módulos dejaba fuera de CI
      # cualquier archivo de prueba nuevo sin que nada lo señalara: así se
      # quedaron sin ejecutar durante semanas 146 de las 355 pruebas de
      # `visual/`, entre ellas todo el route engine y los invariantes de
      # topología. Con `discover`, una prueba nueva entra en CI por existir.
      - name: Pruebas de la skill jurídica (unittest discover)
        working-directory: .claude/skills/legalmente-legal-verification/scripts
        run: python3 -m unittest discover -p 'test_*.py' -v

      - name: Pruebas de scripts de la raíz (unittest discover)
        working-directory: scripts
        run: python3 -m unittest discover -p 'test_*.py' -v

      - name: Fixtures positivos deben validar (exit 0)
        run: |
          set -e
          shopt -s nullglob
          files=(fixtures/piezas/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No se encontraron fixtures positivos en fixtures/piezas/ — la skill no puede considerarse validada."
            exit 1
          fi
          echo "Fixtures positivos encontrados: ${#files[@]}"
          fail=0
          for f in "${files[@]}"; do
            if ! python3 scripts/validate-claim-packet.py "$f"; then
              echo "FALLÓ (debía ser exit 0): $f"
              fail=1
            fi
          done
          exit $fail

      - name: Fixtures negativos deben ser rechazados (exit distinto de 0)
        run: |
          set -e
          shopt -s nullglob
          files=(fixtures/negativos/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No se encontraron fixtures negativos en fixtures/negativos/ — la skill no puede considerarse validada."
            exit 1
          fi
          echo "Fixtures negativos encontrados: ${#files[@]}"
          fail=0
          for f in "${files[@]}"; do
            if python3 scripts/validate-claim-packet.py "$f" >/dev/null 2>&1; then
              echo "FALLÓ (debía ser exit distinto de 0, fue aceptado): $f"
              fail=1
            fi
          done
          exit $fail

      - name: Paquetes reales del piloto deben existir, validar y tener gates coherentes
        run: |
          set -e
          REQUIRED=("pilot/claim-packets/pieza-01-reales.json" "pilot/claim-packets/pieza-02-laboral.json" "pilot/claim-packets/pieza-03-honor.json")
          fail=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "FALTA el paquete obligatorio del piloto: $f"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Los 3 paquetes obligatorios del piloto están presentes."
          for f in "${REQUIRED[@]}"; do
            echo "--- $f ---"
            if ! python3 scripts/validate-claim-packet.py "$f"; then
              echo "FALLÓ (error estructural, gate simulado o aprobación inválida): $f"
              fail=1
            fi
            if ! python3 scripts/check_pilot_governance.py "$f"; then
              fail=1
            fi
          done
          exit $fail

      - name: Fixtures válidas de la cadena post-aprobación deben pasar (exit 0)
        run: |
          set -e
          shopt -s nullglob
          files=(publication/fixtures/validos/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No se encontraron fixtures válidas en publication/fixtures/validos/."
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            if ! python3 scripts/validate-publication-chain.py "$f"; then
              echo "FALLÓ (debía ser exit 0): $f"
              fail=1
            fi
          done
          exit $fail

      - name: Fixtures inválidas de la cadena post-aprobación deben ser rechazadas (exit != 0)
        run: |
          set -e
          shopt -s nullglob
          files=(publication/fixtures/invalidos/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No se encontraron fixtures inválidas en publication/fixtures/invalidos/."
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            if python3 scripts/validate-publication-chain.py "$f" >/dev/null 2>&1; then
              echo "FALLÓ (debía ser rechazada, fue aceptada): $f"
              fail=1
            fi
          done
          exit $fail

      - name: Todo el contenido debe declarar procedencia verificable
        working-directory: .
        run: python3 scripts/validate-content-provenance.py

      - name: Instalar dependencias (solo Pillow, para el compositor)
        working-directory: .
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Pipeline visual — suite completa (proveedor falso, sin red ni créditos)
        working-directory: visual
        run: python3 -m unittest discover -p 'test_*.py' -v

      - name: Ecosistema — registro, relaciones y matriz de gates (unittest discover)
        working-directory: ecosystem
        run: python3 -m unittest discover -p 'test_*.py' -v

      - name: Motor de candidatos — barrera, diversidad y memoria (unittest)
        working-directory: content/topics
        run: python3 -m unittest test_topics -v

      - name: Contrato canónico cross-repo
        working-directory: contract
        run: python3 -m unittest discover -p 'test_*.py' -v

      - name: El pipeline visual no puede aprobar nada por sí solo
        working-directory: visual
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, '.')
          import receipts
          prohibidos = [s for s in receipts.STATUS
                        if 'APROBADO' in s or 'APPROVED' in s or 'PRODUCCION' in s]
          if prohibidos:
              print(f"FALLÓ: el pipeline declara estados de aprobación alcanzables: {prohibidos}")
              sys.exit(1)
          print("OK: ningún status del pipeline visual significa aprobado.")
          PY
